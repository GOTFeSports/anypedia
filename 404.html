<style>
/* ============================================================
   CSS VARIABLES
   ============================================================ */
:root {
  --bg:         #0f0f10;
  --bg2:        #151516;
  --bg3:        #1c1c1e;
  --border:     #252528;
  --text:       #eaeaea;
  --text-muted: #888;
  --accent:     #6bb6ff;
  --accent2:    #3d8fe0;
  --tg:         #2ea6ff;
  --live:       #ff6b6b;
  --upcoming:   #6bb6ff;
  --finished:   #5dff9c;
  --radius:     12px;
  --shadow:     0 4px 24px rgba(0,0,0,.45);
  --transition: color .25s, background-color .25s, border-color .25s;
}
[data-theme="light"] {
  --bg:         #f4f4f6;
  --bg2:        #ffffff;
  --bg3:        #e8e8ec;
  --border:     #d0d0d8;
  --text:       #111114;
  --text-muted: #666;
  --accent:     #1a6fcc;
  --accent2:    #1452a0;
  --tg:         #1a88d6;
  --live:       #c53030;
  --upcoming:   #1a6fcc;
  --finished:   #147a3d;
  --shadow:     0 4px 24px rgba(0,0,0,.12);
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  transition: var(--transition);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent2); }

/* ============================================================
   SITE HEADER (sticky)
   ============================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  transition: var(--transition);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 14px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .5px;
  transition: color .2s;
}
.logo:hover { color: var(--accent); }
.logo-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  margin-top: 1px;
}
.header-search {
  width: 260px;
  padding: 9px 14px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, var(--transition);
}
.header-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(107,182,255,.15);
}
.header-search::placeholder { color: var(--text-muted); }

/* ============================================================
   LAYOUT
   ============================================================ */
.page-body {
  max-width: 1200px;
  margin: 24px auto 80px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px;
  align-items: start;
}

/* ============================================================
   BLOCK (card)
   ============================================================ */
.block {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: var(--transition);
}
.block h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 14px;
  color: var(--text);
}

/* ============================================================
   INFOBOX (sidebar)
   ============================================================ */
.infobox {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  position: sticky;
  top: 76px;
  transition: var(--transition);
}
.infobox h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 20px;
  font-weight: 700;
  margin-bottom: 14px;
  line-height: 1.2;
}
.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.info-row:last-of-type { border-bottom: none; }
.info-label { color: var(--text-muted); flex-shrink: 0; }
.info-val   { font-weight: 500; text-align: right; }

/* Action buttons */
.action-btns {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 14px;
}
.btn {
  display: block;
  width: 100%;
  text-align: center;
  padding: 11px;
  border-radius: 9px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: opacity .2s, transform .1s;
  border: none;
  font-family: 'Inter', sans-serif;
}
.btn:active { transform: scale(.98); }
.btn:hover  { opacity: .88; }
.btn-reg    { background: var(--accent);  color: #000; }
.btn-tg     { background: var(--tg);      color: #000; }
.btn-share  {
  background: var(--bg3);
  color: var(--text);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
}

.tournament-links {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(42px, 1fr));
  gap: 8px;
  margin-top: 2px;
}

.tournament-link {
  height: 42px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg3);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  transition: transform .15s, border-color .2s, background .2s;
}

.tournament-link:hover {
  transform: translateY(-1px);
  border-color: var(--accent);
  background: rgba(107,182,255,.1);
}

.tournament-link img {
  width: 24px;
  height: 24px;
  object-fit: contain;
  display: block;
}

[data-theme="dark"] .tournament-link[aria-label="Rules"] img,
[data-theme="dark"] .tournament-link[aria-label="Bracket"] img {
  filter: brightness(0) invert(1) drop-shadow(0 0 4px rgba(255,255,255,.18));
  opacity: .94;
}

[data-theme="dark"] .tournament-link[aria-label="Rules"]:hover img,
[data-theme="dark"] .tournament-link[aria-label="Bracket"]:hover img {
  opacity: 1;
}

.tournament-link.icon-missing img {
  display: none;
}

.tournament-link.icon-missing::after {
  content: attr(aria-label);
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

/* ============================================================
   COUNTDOWN + TIME
   ============================================================ */
.countdown-wrap {
  margin-bottom: 14px;
}
.start-time-label {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 8px;
}
.start-time-val {
  font-family: 'Rajdhani', sans-serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 10px;
}
.countdown {
  display: flex;
  gap: 8px;
}
.cd-unit {
  flex: 1;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: center;
  padding: 8px 4px 6px;
}
.cd-num {
  font-family: 'Rajdhani', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}
.cd-lbl {
  font-size: 10px;
  color: var(--text-muted);
  letter-spacing: .5px;
  text-transform: uppercase;
  margin-top: 2px;
}
.countdown-status {
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 600;
  padding: 10px 12px;
  border-radius: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
}
.status-live     { color: var(--live); }
.status-finished { color: var(--finished); }
[data-theme="light"] .status-live { background: rgba(197,48,48,.08); }
[data-theme="light"] .status-finished { background: rgba(20,122,61,.1); }

/* ============================================================
   TITLE ROW (with time inline)
   ============================================================ */
.title-row {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.page-title {
  font-family: 'Rajdhani', sans-serif;
  font-size: 28px;
  font-weight: 700;
  line-height: 1.1;
}

/* ============================================================
   DESCRIPTION
   ============================================================ */
.desc-text {
  font-size: 13px;
  line-height: 1.65;
  color: var(--text-muted);
}
.block-section-label {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 16px 0 8px;
}

/* ============================================================
   PRIZE TABLE
   ============================================================ */
.prize-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  color: var(--text-muted);
}
.prize-table th {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--border);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--text-muted);
}
.prize-table td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--border);
}
.prize-table tr:last-child td { border-bottom: none; }
.prize-place { font-size: 16px; }

/* ============================================================
   TEAMS GRID
   ============================================================ */
.team-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}
.team-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px;
  font-size: 12px;
  transition: var(--transition);
}
.team-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.team-header img {
  width: 20px;
  height: 20px;
  border-radius: 4px;
  object-fit: cover;
}
.team-name {
  font-weight: 600;
  font-size: 13px;
  color: var(--text);
  word-break: break-word;
}
.roster-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 24px;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.roster-row:last-child { border-bottom: none; }
.nick {
  color: var(--text);
  min-width: 0;
  overflow-wrap: anywhere;
}
.pos  {
  color: var(--text-muted);
  text-align: center;
  font-variant-numeric: tabular-nums;
}

/* ============================================================
   BRACKET iframe
   ============================================================ */
.bracket-frame {
  border-radius: 9px;
  border: 1px solid var(--border);
  width: 100%;
  height: 500px;
  display: block;
}

/* ============================================================
   CASTERS
   ============================================================ */
.caster-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 10px 14px;
  margin-bottom: 8px;
  font-size: 13px;
  transition: var(--transition);
}
.caster-item:last-child { margin-bottom: 0; }

/* ============================================================
   FOOTER
   ============================================================ */
.site-footer {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  margin-top: 20px;
  padding: 36px 20px 28px;
  transition: var(--transition);
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 32px;
  flex-wrap: wrap;
}
.footer-brand .logo-foot {
  font-family: 'Rajdhani', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .5px;
}
.footer-brand p {
  color: var(--text-muted);
  font-size: 12px;
  margin-top: 6px;
  line-height: 1.6;
  max-width: 260px;
}
.footer-socials-label {
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 10px;
  font-weight: 600;
}
.footer-socials {
  display: flex;
  flex-direction: column;
  gap: 9px;
}
.footer-socials a {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--text-muted);
  font-size: 13px;
  transition: color .2s;
}
.footer-socials a:hover { color: var(--accent); }
.footer-socials a svg { flex-shrink: 0; }
.footer-bottom {
  max-width: 1200px;
  margin: 22px auto 0;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-muted);
  font-size: 12px;
  flex-wrap: wrap;
  gap: 8px;
}
/* ============================================================
   FLOATING BUTTONS
   ============================================================ */
.fab {
  position: fixed;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  box-shadow: var(--shadow);
  transition: transform .2s, background .2s, opacity .3s, var(--transition);
}
.fab:hover { transform: scale(1.1); }
.fab svg { width: 18px; height: 18px; pointer-events: none; }
#themeBtn { bottom: 24px; left:  24px; }
#toTopBtn { bottom: 24px; right: 24px; opacity: 0; pointer-events: none; }
#toTopBtn.visible { opacity: 1; pointer-events: auto; }

/* ============================================================
   TOAST
   ============================================================ */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 13px;
  opacity: 0;
  transition: opacity .25s, transform .25s;
  pointer-events: none;
  z-index: 300;
  white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ============================================================
   SEARCH HIGHLIGHT
   ============================================================ */
.search-hidden { display: none !important; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 900px) {
  .page-body { grid-template-columns: 1fr; }
  .infobox { position: static; order: -1; }
  .team-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .header-inner {
    flex-wrap: wrap;
    padding: 12px;
  }
  .header-search { width: 100%; }
  .page-body {
    margin: 16px auto 72px;
    padding: 0 12px;
    gap: 14px;
  }
  .block,
  .infobox {
    padding: 14px;
    border-radius: 10px;
  }
  .page-title { font-size: 22px; }
  .team-grid { grid-template-columns: 1fr; }
  .countdown { gap: 6px; }
  .cd-num { font-size: 22px; }
  .btn { min-height: 42px; }
  .bracket-frame { height: 360px; }
  .prize-table th,
  .prize-table td { padding: 7px 4px; }
  .fab {
    width: 40px;
    height: 40px;
  }
  #themeBtn { bottom: 16px; left: 16px; }
  #toTopBtn { bottom: 16px; right: 16px; }
  .site-footer { padding: 28px 12px 24px; }
  .footer-inner { gap: 24px; }
  .footer-bottom { align-items: flex-start; }
}
</style>
</head>

<div id="toast"></div>

<!-- ============================================================
     JAVASCRIPT
     ============================================================ -->
<script>
/* ---------- THEME ---------- */
const html = document.documentElement;
const themeBtn  = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const MOON = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
const SUN  = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

function applyTheme(t) {
  html.setAttribute('data-theme', t);
  themeIcon.innerHTML = t === 'dark' ? MOON : SUN;
  localStorage.setItem('ap-theme', t);
}
applyTheme(localStorage.getItem('ap-theme') || 'dark');
themeBtn.addEventListener('click', () =>
  applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

/* ---------- BACK TO TOP ---------- */
const toTopBtn = document.getElementById('toTopBtn');
window.addEventListener('scroll', () =>
  toTopBtn.classList.toggle('visible', window.scrollY > 300));
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

/* ---------- TOAST ---------- */
const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

/* ---------- SHARE ---------- */
function doShare() {
  const url   = window.location.href;
  const title = document.title;
  if (navigator.share) {
    navigator.share({ title, url }).catch(() => {});
  } else {
    navigator.clipboard.writeText(url).then(() => showToast('✓ Ссылка скопирована'));
  }
}

/* ---------- TOURNAMENT DATA ---------- */
function getTournamentIdFromUrl() {
  const paramsId = new URLSearchParams(window.location.search).get('id');
  if (paramsId) return paramsId;

  const path = location.pathname.replace(/\/+$/, '');
  const lastSegment = decodeURIComponent(path.split('/').pop() || '');

  if (!lastSegment || lastSegment === 'tournament.html' || lastSegment === 'index.html') {
    return '';
  }

  return lastSegment;
}

function getSiteBasePath(id) {
  const path = location.pathname;
  if (path.endsWith('/tournament.html') || path.endsWith('/index.html')) {
    return path.slice(0, path.lastIndexOf('/') + 1);
  }
  const suffix = `/${encodeURIComponent(id)}`;
  return path.endsWith(suffix) ? path.slice(0, -suffix.length + 1) : '/';
}

const id = getTournamentIdFromUrl();
const t  = tournaments.find(x => x.id === id);

if (t && new URLSearchParams(window.location.search).has('id')) {
  history.replaceState(null, '', `${getSiteBasePath(id)}${encodeURIComponent(id)}`);
}

if (!t) {
  document.body.innerHTML = `
    <div style="height:100vh;display:flex;align-items:center;justify-content:center;
                background:var(--bg);font-family:'Inter',sans-serif;text-align:center">
      <div>
        <h1 style="font-size:22px;margin-bottom:10px">❌ Турнир не найден</h1>
        <p style="color:#888;margin-bottom:20px">Проверьте ссылку или вернитесь на главную</p>
        <a href="${getSiteBasePath(id)}" style="padding:10px 18px;background:#1c1c1e;border:1px solid #2a2a2a;
           border-radius:10px;color:#6bb6ff;display:inline-block">← Назад</a>
      </div>
    </div>`;
  throw new Error('Tournament not found');
}

document.title = `${t.title} · Anypedia`;
document.getElementById('pageBody').style.display = 'grid';

/* ---------- DATE / STATUS HELPERS ---------- */
function toLocalDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function formatDateLong(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('ru-RU', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
}

const now   = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const startD = toLocalDate(t.start);
const endD   = toLocalDate(t.end);

function getTournamentStatus() {
  if (today < startD) return 'upcoming';
  if (today > endD)   return 'finished';
  return 'live';
}

/* ---------- COUNTDOWN ---------- */
// Составляем UTC-момент старта в МСК (UTC+3)
function buildMskStartDate() {
  const [y, m, d] = t.start.split('-').map(Number);
  const time = t.startTime || '12:00';
  const [hh, mm] = time.split(':').map(Number);
  // МСК = UTC+3, поэтому UTC час = hh - 3
  return new Date(Date.UTC(y, m - 1, d, hh - 3, mm, 0));
}

const mskStart = buildMskStartDate();

function formatMskLabel() {
  const [y, m, d] = t.start.split('-').map(Number);
  const date = new Date(y, m - 1, d).toLocaleDateString('ru-RU', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
  return `${date}, ${t.startTime || '12:00'} МСК`;
}

function pad(n) { return String(n).padStart(2, '0'); }

function renderCountdown() {
  const status = getTournamentStatus();

  // Уже идёт
  if (status === 'live') {
    return `<div class="countdown-status status-live">🔴 Турнир идёт прямо сейчас</div>`;
  }
  // Завершён
  if (status === 'finished') {
    return `<div class="countdown-status status-finished">✅ Турнир завершён</div>`;
  }

  // Будущий — строим таймер
  const diff = mskStart - Date.now();
  if (diff <= 0) {
    return `<div class="countdown-status status-live">🔴 Стартует сейчас!</div>`;
  }

  const days    = Math.floor(diff / 86400000);
  const hours   = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  return `
    <div class="start-time-label">Дата и время старта (МСК)</div>
    <div class="start-time-val">${formatMskLabel()}</div>
    <div class="countdown" id="cdWrap">
      <div class="cd-unit"><div class="cd-num" id="cdD">${pad(days)}</div><div class="cd-lbl">дней</div></div>
      <div class="cd-unit"><div class="cd-num" id="cdH">${pad(hours)}</div><div class="cd-lbl">часов</div></div>
      <div class="cd-unit"><div class="cd-num" id="cdM">${pad(minutes)}</div><div class="cd-lbl">минут</div></div>
      <div class="cd-unit"><div class="cd-num" id="cdS">${pad(seconds)}</div><div class="cd-lbl">секунд</div></div>
    </div>`;
}

// Тикает каждую секунду
function tickCountdown() {
  const status = getTournamentStatus();
  if (status !== 'upcoming') return; // таймер больше не нужен

  const diff = mskStart - Date.now();
  if (diff <= 0) {
    document.getElementById('cdWrap').outerHTML = `<div class="countdown-status status-live">🔴 Стартует сейчас!</div>`;
    return;
  }

  const days    = Math.floor(diff / 86400000);
  const hours   = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  const elD = document.getElementById('cdD');
  const elH = document.getElementById('cdH');
  const elM = document.getElementById('cdM');
  const elS = document.getElementById('cdS');
  if (elD) elD.textContent = pad(days);
  if (elH) elH.textContent = pad(hours);
  if (elM) elM.textContent = pad(minutes);
  if (elS) elS.textContent = pad(seconds);
}

setInterval(tickCountdown, 1000);

/* ---------- INFOBOX ---------- */
const dateText = t.start === t.end
  ? formatDateLong(t.start)
  : `${formatDateLong(t.start)} — ${formatDateLong(t.end)}`;

const TOURNAMENT_LINK_TYPES = [
  { key: 'dotabuff', label: 'Dotabuff', icon: 'dotabuff.png', aliases: ['dotabuffLink'] },
  { key: 'discord',  label: 'Discord',  icon: 'discord.png',  aliases: ['discordLink'] },
  { key: 'rules',    label: 'Rules',    icon: 'rules.png',    aliases: ['rulesLink'] },
  { key: 'bracket',  label: 'Bracket',  icon: 'bracket.png',  aliases: ['bracketLink', 'bracketEmbed'] }
];

function getTournamentExtraLink(type) {
  const source = t.links || {};
  const value = source[type.key] || type.aliases.map(alias => t[alias]).find(Boolean) || '';
  return typeof value === 'string' ? value.trim() : '';
}

function renderTournamentLinks() {
  const links = TOURNAMENT_LINK_TYPES
    .map(type => ({ ...type, url: getTournamentExtraLink(type) }))
    .filter(type => type.url);

  if (!links.length) return '';

  return `
    <div class="tournament-links" aria-label="Ссылки турнира">
      ${links.map(link => `
        <a class="tournament-link" href="${link.url}" target="_blank" rel="noopener" aria-label="${link.label}" title="${link.label}">
          <img src="${link.icon}" alt="" loading="lazy" onerror="this.closest('a').classList.add('icon-missing')">
        </a>
      `).join('')}
    </div>`;
}

document.getElementById('infobox').innerHTML = `
  <h2>${t.title}</h2>

  <div class="countdown-wrap">${renderCountdown()}</div>

  <div class="info-row"><span class="info-label">Даты</span>    <span class="info-val">${dateText}</span></div>
  <div class="info-row"><span class="info-label">Приз</span>    <span class="info-val" style="font-weight:700;color:var(--accent)">${t.prize || '—'}</span></div>
  <div class="info-row"><span class="info-label">Регион</span>  <span class="info-val">${t.location || '—'}</span></div>
  <div class="info-row"><span class="info-label">Команд</span>  <span class="info-val">${t.teams ?? '—'}</span></div>
  <div class="info-row"><span class="info-label">Формат</span>  <span class="info-val">${t.format || '—'}</span></div>
  <div class="info-row"><span class="info-label">Лимит</span>   <span class="info-val">${t.limit || '—'}</span></div>
  <div class="info-row"><span class="info-label">Победитель</span><span class="info-val">${t.winner || 'TBD'}</span></div>
  <div class="info-row"><span class="info-label">Организатор</span><span class="info-val">${t.organizer || '—'}</span></div>

  <div class="action-btns">
    <a class="btn btn-reg"   href="${t.registrationLink}" target="_blank" rel="noopener">📋 Регистрация</a>
    <a class="btn btn-tg"    href="${t.telegramLink}"     target="_blank" rel="noopener">✈️ Telegram</a>
    <button class="btn btn-share" onclick="doShare()">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/>
        <line x1="15.41" y1="6.51"  x2="8.59"  y2="10.49"/>
      </svg>
      Поделиться
    </button>
    ${renderTournamentLinks()}
  </div>
`;

/* ---------- DESCRIPTION + PRIZES ---------- */
function prizeTable() {
  if (!Array.isArray(t.prizePool) || !t.prizePool.length) {
    return `<div style="color:var(--text-muted);font-size:13px">Призовой фонд не указан</div>`;
  }
  const medals = ['🥇','🥈','🥉','🏅'];
  const rows = [...t.prizePool]
    .sort((a,b) => a.place - b.place)
    .map(p => `
      <tr>
        <td><span class="prize-place">${medals[p.place-1]||'🏅'}</span> ${p.place}</td>
        <td>${p.team || '—'}</td>
        <td style="font-weight:600;color:var(--text)">${p.amount}</td>
      </tr>`).join('');
  return `
    <table class="prize-table">
      <thead><tr><th>Место</th><th>Команда</th><th>Приз</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

document.getElementById('descBlock').innerHTML = `
  <div class="title-row">
    <h1 class="page-title">${t.title}</h1>
  </div>
  <p class="desc-text">${t.description || '—'}</p>
  <div class="block-section-label">Формат</div>
  <p class="desc-text">${t.format || '—'}</p>
  <div class="block-section-label">Призовой фонд</div>
  ${prizeTable()}
`;

/* ---------- TEAMS ---------- */
document.getElementById('teams').innerHTML = (t.teamsList || []).map(team => `
  <div class="team-card">
    <div class="team-header">
      <img src="${team.logo || 'dota2.png'}" alt="${team.name}">
      <div class="team-name">${team.name}</div>
    </div>
    ${(team.roster || [])
      .sort((a,b) => a.pos - b.pos)
      .map(p => `
        <div class="roster-row">
          <span class="nick">${p.nick}</span>
          <span class="pos">${p.pos}</span>
        </div>`).join('')}
  </div>`).join('');

/* ---------- BRACKET ---------- */
document.getElementById('bracketFrame').src = t.bracketEmbed || '';

/* ---------- CASTERS ---------- */
document.getElementById('casters').innerHTML = (t.casters || []).map(c => `
  <div class="caster-item">
    ${c.link
      ? `<a href="${c.link}" target="_blank" rel="noopener">${c.name || 'TBD'}</a>`
      : `<span>${c.name || 'TBD'}</span>`}
  </div>`).join('');

/* ---------- SEARCH (внутри страницы) ---------- */
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  if (!q) {
    document.querySelectorAll('.team-card, .caster-item').forEach(el => el.classList.remove('search-hidden'));
    return;
  }
  document.querySelectorAll('.team-card').forEach(el => {
    el.classList.toggle('search-hidden', !el.innerText.toLowerCase().includes(q));
  });
  document.querySelectorAll('.caster-item').forEach(el => {
    el.classList.toggle('search-hidden', !el.innerText.toLowerCase().includes(q));
  });
});
</script>
</body>
</html>
