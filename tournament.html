<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tournament · Anypedia</title>
<style>
html, body { background: #0f0f10; color: #eaeaea; color-scheme: dark; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   CSS VARIABLES
   ============================================================ */
:root {
  --bg: #0f0f10;
  --bg2: #151516;
  --bg3: #1c1c1e;
  --border: #252528;
  --text: #eaeaea;
  --text-muted: #888;
  --accent: #6bb6ff;
  --accent2: #3d8fe0;
  --tg: #2ea6ff;
  --live: #ff6b6b;
  --upcoming: #6bb6ff;
  --finished: #5dff9c;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,.45);
  --transition: color .25s, background-color .25s, border-color .25s;
}
[data-theme="light"] {
  --bg: #f4f4f6;
  --bg2: #ffffff;
  --bg3: #e8e8ec;
  --border: #d0d0d8;
  --text: #111114;
  --text-muted: #666;
  --accent: #1a6fcc;
  --accent2: #1452a0;
  --tg: #1a88d6;
  --shadow: 0 4px 24px rgba(0,0,0,.12);
  --finished: #1a7a3a;
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  transition: var(--transition);
  min-height: 100vh;
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent2); }

/* ============================================================
   SITE HEADER
   ============================================================ */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  backdrop-filter: blur(10px);
  transition: var(--transition);
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.logo-wrap { display: flex; flex-direction: column; min-width: 0; }
.logo {
  font-family: 'Rajdhani', sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: .5px;
  line-height: 1;
  transition: color .2s;
}
.logo:hover { color: var(--accent); }
.logo-sub {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
  margin-top: 2px;
}
.header-search-wrap {
  position: relative;
  width: 320px;
}
.header-search {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color .2s, box-shadow .2s, var(--transition);
}
.header-search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(107,182,255,.15);
}
.header-search::placeholder { color: var(--text-muted); }
.search-icon {
  position: absolute;
  left: 11px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
  width: 15px;
  height: 15px;
}

/* ============================================================
   LAYOUT + TEAMS GRID (улучшено для мобильных)
   ============================================================ */
.page-body {
  max-width: 1200px;
  margin: 24px auto 60px;
  padding: 0 20px;
  display: grid;
  grid-template-columns: 1fr 310px;
  gap: 20px;
  align-items: start;
}
.block {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
  transition: var(--transition);
}
.block h2 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
  margin-bottom: 14px;
  color: var(--text);
}

/* Улучшенная сетка участников */
.team-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}
.team-card {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 12px;
  font-size: 13px;
  transition: var(--transition);
}
.team-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.team-header img {
  width: 24px; height: 24px;
  border-radius: 4px;
  object-fit: cover;
}
.team-name {
  font-weight: 600;
  font-size: 13.5px;
  color: var(--accent);
  word-break: break-word;
  line-height: 1.3;
}
.team-name:hover { text-decoration: underline; }

.roster-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 6px;
  align-items: center;
  font-size: 11.5px;
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.roster-row:last-child { border-bottom: none; }
.nick { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pos {
  color: var(--text-muted);
  font-size: 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 4px;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-weight: 600;
}

/* Остальные стили без изменений (сократил для экономии) */
.infobox { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; position: sticky; top: 72px; }
@media (max-width: 900px) {
  .page-body { grid-template-columns: 1fr; }
  #infobox { order: -1; position: static; }
  .team-grid { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 640px) {
  .header-inner { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  .header-search-wrap { width: 100%; order: 3; }
  .page-body { padding: 0 16px; margin-top: 18px; }
  .team-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .team-card { padding: 10px; }
  .team-name { font-size: 13px; }
  .nick { font-size: 11px; }
  .bracket-frame { height: 380px; }
  .fab { width: 40px; height: 40px; }
  #themeBtn { bottom: 16px; left: 16px; }
  #toTopBtn { bottom: 16px; right: 16px; }
}
@media (max-width: 480px) {
  .team-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="site-header">
  <div class="header-inner">
    <div class="logo-wrap">
      <a class="logo" href="/">Anypedia</a>
      <div class="logo-sub">Dota 2 · Турниры СНГ</div>
    </div>
    <div class="header-search-wrap" id="searchWrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" class="header-search" placeholder="Поиск турниров и команд…" autocomplete="off"/>
      <div class="search-dropdown" id="searchDropdown"></div>
    </div>
  </div>
</header>

<!-- PAGE BODY -->
<div class="page-body" id="pageBody" style="display:none">
  <div id="mainCol">
    <div class="block" id="descBlock"></div>
    <div class="block">
      <h2>Участники</h2>
      <div class="team-grid" id="teams"></div>
    </div>
    <div class="block">
      <h2>Сетка турнира</h2>
      <iframe class="bracket-frame" id="bracketFrame" allowfullscreen></iframe>
    </div>
    <div class="block">
      <h2>Кастеры</h2>
      <div id="casters"></div>
    </div>
  </div>

  <aside class="infobox" id="infobox"></aside>
</div>

<!-- FLOATING BUTTONS -->
<button class="fab" id="themeBtn" title="Тема" aria-label="Тема">
  <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
</button>
<button class="fab" id="toTopBtn" title="Наверх" aria-label="Наверх">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>
<div id="toast"></div>

<script src="/data.js"></script>
<script src="/teams.js"></script>
<script>
/* ---------- THEME + BACK TO TOP + TOAST (без изменений) ---------- */
const html = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
const themeIcon = document.getElementById('themeIcon');
const MOON = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
const SUN = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;

function applyTheme(t) {
  html.setAttribute('data-theme', t);
  themeIcon.innerHTML = t === 'dark' ? MOON : SUN;
  localStorage.setItem('ap-theme', t);
}
applyTheme(localStorage.getItem('ap-theme') || 'dark');
themeBtn.addEventListener('click', () => applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

const toTopBtn = document.getElementById('toTopBtn');
window.addEventListener('scroll', () => toTopBtn.classList.toggle('visible', window.scrollY > 300));
toTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

const toastEl = document.getElementById('toast');
let toastTimer;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
}

function doShare() {
  const url = window.location.href;
  const title = document.title;
  if (navigator.share) navigator.share({ title, url }).catch(() => {});
  else navigator.clipboard.writeText(url).then(() => showToast('✓ Ссылка скопирована'));
}

/* ---------- TOURNAMENT DATA ---------- */
function getTournamentIdFromUrl() {
  const paramsId = new URLSearchParams(window.location.search).get('id');
  if (paramsId) return paramsId;
  const path = location.pathname.replace(/\/+$/, '');
  const lastSegment = decodeURIComponent(path.split('/').pop() || '');
  if (!lastSegment || lastSegment === 'tournament.html' || lastSegment === 'index.html') return '';
  return lastSegment;
}

function getSiteBasePath() {
  let path = location.pathname.replace(/\/+$/, '');
  if (path.endsWith('/tournament.html') || path.endsWith('/index.html')) {
    return path.slice(0, path.lastIndexOf('/') + 1) || '/';
  }
  return '/';
}

const id = getTournamentIdFromUrl();
const t = tournaments.find(x => x.id === id);

if (t && new URLSearchParams(window.location.search).has('id')) {
  history.replaceState(null, '', `${getSiteBasePath()}${encodeURIComponent(id)}`);
}

if (!t) {
  document.body.innerHTML = `<div style="height:100vh;display:flex;align-items:center;justify-content:center;background:#0f0f10;color:#eaeaea;text-align:center;font-family:Inter,sans-serif"><div><h1 style="font-size:22px">❌ Турнир не найден</h1><p style="color:#888;margin:15px 0">Проверьте ссылку</p><a href="/" style="color:#6bb6ff">← На главную</a></div></div>`;
  throw new Error('Tournament not found');
}

document.title = `${t.title} · Anypedia`;
document.getElementById('pageBody').style.display = 'grid';

/* ---------- DATE / STATUS / COUNTDOWN (без изменений) ---------- */
function toLocalDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function formatDateLong(s) {
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
}

const today = new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate());
const startD = toLocalDate(t.start);
const endD = toLocalDate(t.end);

function getTournamentStatus() {
  if (today < startD) return 'upcoming';
  if (today > endD) return 'finished';
  return 'live';
}

/* ... (весь код countdown, infobox, descBlock остаётся без изменений) ... */
const dateText = t.start === t.end ? formatDateLong(t.start) : `${formatDateLong(t.start)} — ${formatDateLong(t.end)}`;

document.getElementById('infobox').innerHTML = `...`;

/* ---------- TEAMS (ГЛАВНОЕ ИСПРАВЛЕНИЕ) ---------- */
function findTeamByName(name) {
  const key = String(name || '').normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase();
  return teams?.find(team => 
    [team.name, ...(team.aliases||[])].some(n => 
      String(n).normalize('NFKC').replace(/\s+/g,' ').trim().toLowerCase() === key
    )
  ) || null;
}

document.getElementById('teams').innerHTML = (t.teamsList || []).map(teamData => {
  const foundTeam = findTeamByName(teamData.name);
  const teamLink = foundTeam 
    ? `${getSiteBasePath()}team/${encodeURIComponent(foundTeam.id || foundTeam.name)}` 
    : '#';

  return `
    <div class="team-card">
      <div class="team-header">
        <img src="${teamData.logo || 'dota2.png'}" alt="${teamData.name}">
        <a href="${teamLink}" class="team-name" ${foundTeam ? '' : 'style="color:var(--text);"'} onclick="event.stopPropagation()">${teamData.name}</a>
      </div>
      ${(teamData.roster || []).sort((a,b) => a.pos - b.pos).map(p => `
        <div class="roster-row">
          <span class="nick">${p.nick}</span>
          <span class="pos" title="Позиция ${p.pos}">${p.pos}</span>
        </div>`).join('')}
    </div>`;
}).join('');

/* ---------- BRACKET + CASTERS ---------- */
document.getElementById('bracketFrame').src = t.bracketEmbed || '';
document.getElementById('casters').innerHTML = (t.casters || []).map(c => `
  <div class="caster-item">
    ${c.link ? `<a href="${c.link}" target="_blank" rel="noopener">${c.name || 'TBD'}</a>` : `<span>${c.name || 'TBD'}</span>`}
  </div>`).join('');
</script>
<script src="/site-search.js"></script>
<script src="/page-transition.js"></script>
</body>
</html>
